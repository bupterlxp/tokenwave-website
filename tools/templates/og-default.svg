<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- particle field -->
  <g fill="#3B82F6" opacity="0.5">
    <rect x="80" y="90" width="7" height="7" rx="2"/><rect x="220" y="60" width="5" height="5" rx="1.5"/>
    <rect x="1050" y="120" width="6" height="6" rx="2"/><rect x="940" y="70" width="5" height="5" rx="1.5"/>
    <rect x="1120" y="300" width="7" height="7" rx="2"/><rect x="150" y="480" width="6" height="6" rx="2"/>
    <rect x="360" y="540" width="5" height="5" rx="1.5"/><rect x="820" y="520" width="7" height="7" rx="2"/>
  </g>
  <g fill="#8B5CF6" opacity="0.45">
    <rect x="320" y="110" width="6" height="6" rx="2"/><rect x="700" y="80" width="5" height="5" rx="1.5"/>
    <rect x="1010" y="480" width="6" height="6" rx="2"/><rect x="90" y="330" width="5" height="5" rx="1.5"/>
    <rect x="560" y="560" width="6" height="6" rx="2"/><rect x="1150" y="60" width="5" height="5" rx="1.5"/>
  </g>

  <!-- the token wave -->
  <path d="M -20 210 Q 130 130 280 195 T 580 190 T 880 175 T 1230 130"
        fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <path d="M -20 245 Q 140 175 300 228 T 610 224 T 910 206 T 1230 168"
        fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <text x="96" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92"
        font-weight="bold" fill="#ffffff" letter-spacing="-2">TokenWave AI</text>
  <text x="100" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36"
        fill="#cbd5e1">Transparent, Comparable AI Benchmarks</text>

  <text x="100" y="540" font-family="Menlo, Consolas, monospace" font-size="24" fill="#64748b">48 benchmarks · 4 domains · Agents / MLLM / AIGC / LLM</text>
  <rect x="100" y="560" width="64" height="4" rx="2" fill="url(#wave)"/>
</svg>
